<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shisha - 消息</title>
    <link rel="icon" type="image/png" href="/static/shisha.png" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/message-images.css" />
    <script src="/static/common.js" defer></script>
    <script src="/static/messages.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-navigation></aside>
      <main class="main messages-main" id="top">
        <div class="page-header">
          <div>
            <p class="eyebrow">SHISHA / MESSAGES</p>
            <h1>消息</h1>
            <p class="intro">查看群聊记录和对应的摘要。</p>
          </div>
          <button
            class="icon-button"
            id="refresh-messages"
            type="button"
            aria-label="刷新消息"
            title="刷新消息"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
            </svg>
          </button>
        </div>
        <div class="mobile-status">
          <span class="status-dot" data-status-dot></span
          ><strong data-status>等待配置</strong
          ><span data-status-detail>完成设置后开始监听</span>
        </div>
        <div class="conversation-layout">
          <aside class="conversation-groups" aria-label="监听群聊">
            <div class="conversation-groups-heading">群聊</div>
            <div id="conversation-groups" class="conversation-group-list">
              <p class="conversation-placeholder">正在读取…</p>
            </div>
          </aside>
          <section class="conversation-pane" aria-label="群消息">
            <header id="conversation-heading" class="conversation-heading">
              <strong>选择群聊</strong>
            </header>
            <div id="conversation-scroll" class="conversation-scroll">
              <div id="conversation-content" class="conversation-content">
                <p class="conversation-empty">选择一个群聊查看消息。</p>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
