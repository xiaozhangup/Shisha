<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shisha - 消息</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js" defer></script>
    <script src="/static/messages.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-navigation></aside>
      <main class="main" id="top">
        <div class="page-header">
          <div>
            <p class="eyebrow">SHISHA / MESSAGES</p>
            <h1>消息</h1>
            <p class="intro">查看群消息和提交给 AI 的内容。</p>
          </div>
          <button
            class="icon-button"
            id="refresh-messages"
            type="button"
            aria-label="刷新消息"
            title="刷新消息"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
            </svg>
          </button>
        </div>
        <div class="mobile-status">
          <span class="status-dot" data-status-dot></span
          ><strong data-status>等待配置</strong
          ><span data-status-detail>完成设置后开始监听</span>
        </div>
        <div class="message-tabs" role="tablist" aria-label="消息类型">
          <button
            class="active"
            type="button"
            role="tab"
            aria-selected="true"
            data-kind="messages"
          >
            群消息
          </button>
          <button type="button" role="tab" aria-selected="false" data-kind="ai">
            AI 摘要
          </button>
        </div>
        <div id="message-list" class="message-list" aria-live="polite">
          <p class="message-empty">正在读取…</p>
        </div>
        <button id="load-more" class="load-more" type="button" hidden>
          加载更多
        </button>
      </main>
    </div>
  </body>
</html>
