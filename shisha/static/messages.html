<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shisha - 消息</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js" defer></script>
    <script src="/static/messages.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Shisha 首页">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 36 36" fill="none">
              <path
                d="M22.8 9.2c-1.8-1.3-4.1-1.9-6.3-1.4-2.2.4-3.7 1.8-3.7 3.6 0 4.7 10.2 2.6 10.2 8 0 2.2-2 3.9-4.8 4.2-2.5.3-5-.5-6.8-2"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <path
                d="M12 28h12"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                opacity=".55"
              /></svg
          ></span>
          <span class="brand-name">Shisha</span>
        </a>
        <div class="side-label">菜单</div>
        <nav class="navigation primary-nav" aria-label="页面导航">
          <a href="/"><span class="nav-icon">01</span>设置</a>
          <a class="active" href="/messages"
            ><span class="nav-icon">02</span>消息</a
          >
        </nav>
        <div class="side-footer">
          <span class="status-dot" data-status-dot></span>
          <div>
            <strong data-status>等待配置</strong
            ><span data-status-detail>完成设置后开始监听</span>
          </div>
        </div>
      </aside>
      <main class="main" id="top">
        <div class="page-header">
          <div>
            <p class="eyebrow">SHISHA / MESSAGES</p>
            <h1>消息</h1>
            <p class="intro">查看群消息和提交给 AI 的内容。</p>
          </div>
          <button class="refresh-button" id="refresh-messages" type="button">
            刷新 <span aria-hidden="true">↻</span>
          </button>
        </div>
        <div class="mobile-status">
          <span class="status-dot" data-status-dot></span
          ><strong data-status>等待配置</strong
          ><span data-status-detail>完成设置后开始监听</span>
        </div>
        <div class="message-tabs" role="tablist" aria-label="消息类型">
          <button
            class="active"
            type="button"
            role="tab"
            aria-selected="true"
            data-kind="messages"
          >
            群消息
          </button>
          <button type="button" role="tab" aria-selected="false" data-kind="ai">
            AI 摘要
          </button>
        </div>
        <div id="message-list" class="message-list" aria-live="polite">
          <p class="message-empty">正在读取…</p>
        </div>
        <button id="load-more" class="load-more" type="button" hidden>
          加载更多
        </button>
      </main>
    </div>
  </body>
</html>
