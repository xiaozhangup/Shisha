<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shisha - 规则</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js" defer></script>
    <script src="/static/autosave.js" defer></script>
    <script src="/static/rules.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-navigation></aside>
      <main class="main">
        <div class="page-header">
          <div>
            <p class="eyebrow">SHISHA / RULES</p>
            <h1>监听规则</h1>
            <p class="intro">设置摘要触发方式和通知群聊。</p>
          </div>
          <span class="save-state" data-save-state role="status"
            >设置自动保存</span
          >
        </div>
        <div class="mobile-status">
          <span class="status-dot" data-status-dot></span
          ><strong data-status>等待配置</strong
          ><span data-status-detail>完成设置后开始监听</span>
        </div>
        <section class="settings-section">
          <div class="section-heading">
            <div>
              <h2>触发条件</h2>
            </div>
          </div>
          <div class="field">
            <label for="keyword-input">关键词</label>
            <div class="keyword-editor">
              <span id="keyword-list" class="keyword-list"></span>
              <span class="keyword-entry">
                <input
                  id="keyword-input"
                  type="text"
                  placeholder="输入关键词后按回车"
                  autocomplete="off"
                />
              </span>
            </div>
            <small>关键词或 @全体成员 触发摘要。</small>
          </div>
          <label class="field rule-delay"
            ><span>合并等待时间</span
            ><span class="with-unit"
              ><input
                id="debounce-seconds"
                type="number"
                min="1"
                max="300"
                step="1"
              /><span>秒</span></span
            ><small>同一发送者的相邻消息会合并处理。</small></label
          >
        </section>
        <section class="settings-section">
          <div class="section-heading">
            <div>
              <h2>群通知</h2>
            </div>
          </div>
          <label class="setting-toggle"
            ><span>发送摘要到群聊</span
            ><span class="switch"
              ><input id="notify-enabled" type="checkbox" /><span
                class="switch-track"
              ></span></span
          ></label>
          <label class="field"
            ><span>发送账号</span
            ><select id="notification-sender">
              <option value="self">当前监听账号</option>
              <option value="other">其他 OneBot 账号</option>
            </select></label
          >
          <p id="notification-connection-hint" class="connection-hint" hidden>
            <a href="/#notification-connection">配置其他账号的连接地址和令牌</a>
          </p>
          <label class="field"
            ><span>通知群聊</span
            ><select id="notification-group">
              <option value="">选择通知群聊</option>
            </select></label
          >
          <div class="rule-group-actions">
            <p id="group-message" class="catalog-message" role="status"></p>
            <button
              class="icon-button"
              id="refresh-groups"
              type="button"
              aria-label="刷新群列表"
              title="刷新群列表"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
              </svg>
            </button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
