<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shisha - 设置</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#top" aria-label="Shisha 首页">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 36 36" fill="none">
              <path
                d="M22.8 9.2c-1.8-1.3-4.1-1.9-6.3-1.4-2.2.4-3.7 1.8-3.7 3.6 0 4.7 10.2 2.6 10.2 8 0 2.2-2 3.9-4.8 4.2-2.5.3-5-.5-6.8-2"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <path
                d="M12 28h12"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                opacity=".55"
              /></svg
          ></span>
          <span class="brand-name">Shisha</span>
        </a>
        <div class="side-label">配置</div>
        <nav class="navigation" aria-label="设置导航">
          <a href="#connection"><span class="nav-icon">01</span>连接</a>
          <a href="#rules"><span class="nav-icon">02</span>监听规则</a>
          <a href="#model"><span class="nav-icon">03</span>摘要模型</a>
          <a href="#todoist"><span class="nav-icon">04</span>Todoist</a>
        </nav>
        <div class="side-footer">
          <span class="status-dot" data-status-dot></span>
          <div>
            <strong data-status>等待配置</strong
            ><span data-status-detail>完成设置后开始监听</span>
          </div>
        </div>
      </aside>

      <main class="main" id="top">
        <div class="page-header">
          <div>
            <p class="eyebrow">SHISHA / SETTINGS</p>
            <h1>设置</h1>
            <p class="intro">连接群聊，整理通知中的任务。</p>
          </div>
          <button class="save-button" type="submit" form="settings-form">
            <span>保存设置</span><span aria-hidden="true">↗</span>
          </button>
        </div>

        <div class="mobile-status">
          <span class="status-dot" data-status-dot></span
          ><strong data-status>等待配置</strong
          ><span data-status-detail>完成设置后开始监听</span>
        </div>
        <form id="settings-form" autocomplete="off">
          <section class="settings-section" id="connection">
            <div class="section-heading">
              <div>
                <span class="section-number">01</span>
                <h2>连接</h2>
              </div>
              <p>SnowLuma 的 OneBot 地址与令牌</p>
            </div>
            <div class="fields two-columns">
              <label class="field"
                ><span>HTTP 地址</span
                ><input
                  name="snowluma.http_url"
                  type="url"
                  required
                  placeholder="http://127.0.0.1:3000/"
              /></label>
              <label class="field"
                ><span>WebSocket 地址</span
                ><input
                  name="snowluma.ws_url"
                  type="url"
                  required
                  placeholder="ws://127.0.0.1:3001/"
              /></label>
              <label class="field"
                ><span>HTTP 令牌</span
                ><span class="secret"
                  ><input
                    name="snowluma.http_token"
                    type="password"
                    autocomplete="new-password"
                    placeholder="可留空"
                  /><button type="button" data-clear="snowluma.http_token">
                    清除
                  </button></span
                ></label
              >
              <label class="field"
                ><span>WebSocket 令牌</span
                ><span class="secret"
                  ><input
                    name="snowluma.ws_token"
                    type="password"
                    autocomplete="new-password"
                    placeholder="可留空"
                  /><button type="button" data-clear="snowluma.ws_token">
                    清除
                  </button></span
                ></label
              >
            </div>
          </section>

          <section class="settings-section" id="rules">
            <div class="section-heading">
              <div>
                <span class="section-number">02</span>
                <h2>监听规则</h2>
              </div>
              <p>关键词或 @全体成员 触发摘要</p>
            </div>
            <div class="group-setting">
              <div class="group-heading">
                <div>
                  <span>监听群聊</span
                  ><small id="group-count">读取当前账号的群聊</small>
                </div>
                <button type="button" id="refresh-groups">刷新</button>
              </div>
              <div
                class="group-list"
                id="group-list"
                role="group"
                aria-label="监听群聊"
              >
                <p class="group-empty">正在读取群列表…</p>
              </div>
            </div>
            <div class="fields two-columns">
              <label class="field"
                ><span>通知群号</span
                ><input
                  name="filter.notification_group"
                  type="text"
                  inputmode="numeric"
                  placeholder="接收摘要的群号"
              /></label>
              <label class="field"
                ><span>合并等待时间</span
                ><span class="with-unit"
                  ><input
                    name="filter.debounce_seconds"
                    type="number"
                    min="1"
                    max="300"
                    required
                  /><span>秒</span></span
                ><small>同一发送者的相邻消息会合并处理</small></label
              >
              <label class="field full"
                ><span>触发关键词</span
                ><textarea
                  name="filter.keywords"
                  rows="3"
                  placeholder="每行一个关键词"
                ></textarea
                ><small>也可以用逗号分隔</small></label
              >
            </div>
          </section>

          <section class="settings-section" id="model">
            <div class="section-heading">
              <div>
                <span class="section-number">03</span>
                <h2>摘要模型</h2>
              </div>
              <p>兼容 Chat Completions 的 API</p>
            </div>
            <div class="fields two-columns">
              <label class="field"
                ><span>API 地址</span
                ><input
                  name="ai.base_url"
                  type="url"
                  required
                  placeholder="https://..."
              /></label>
              <label class="field"
                ><span>模型名称</span
                ><input name="ai.model" type="text" placeholder="模型名称"
              /></label>
              <label class="field full"
                ><span>API 密钥</span
                ><span class="secret"
                  ><input
                    name="ai.api_key"
                    type="password"
                    autocomplete="new-password"
                    placeholder="输入 API 密钥"
                  /><button type="button" data-clear="ai.api_key">
                    清除
                  </button></span
                ></label
              >
            </div>
          </section>

          <section class="settings-section last" id="todoist">
            <div class="section-heading">
              <div>
                <span class="section-number">04</span>
                <h2>Todoist</h2>
              </div>
              <p>将提取结果保存为任务</p>
            </div>
            <div class="fields two-columns">
              <label class="field"
                ><span>API 令牌</span
                ><span class="secret"
                  ><input
                    name="todoist.token"
                    type="password"
                    autocomplete="new-password"
                    placeholder="输入 Todoist 令牌"
                  /><button type="button" data-clear="todoist.token">
                    清除
                  </button></span
                ></label
              >
              <label class="field"
                ><span>项目与板块</span
                ><input
                  name="todoist.section"
                  type="text"
                  placeholder="项目名.板块名"
                /><small>留空时保存到收件箱</small></label
              >
            </div>
          </section>
          <div class="form-footer">
            <span>更改会在保存后生效</span
            ><button class="text-save" type="submit">
              保存设置 <span aria-hidden="true">↗</span>
            </button>
          </div>
        </form>
        <div class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
  </body>
</html>
