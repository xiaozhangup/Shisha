<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shisha - 设置</title>
    <link rel="icon" type="image/png" href="/static/shisha.png" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/common.js" defer></script>
    <script src="/static/autosave.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-navigation></aside>
      <main class="main" id="top">
        <div class="page-header">
          <div>
            <p class="eyebrow">SHISHA / SETTINGS</p>
            <h1>设置</h1>
            <p class="intro">连接服务并管理密钥。</p>
          </div>
          <span class="save-state" data-save-state role="status"
            >设置自动保存</span
          >
        </div>
        <div class="mobile-status">
          <span class="status-dot" data-status-dot></span
          ><strong data-status>等待配置</strong
          ><span data-status-detail>完成设置后开始监听</span>
        </div>
        <form id="settings-form" autocomplete="off">
          <section class="settings-section" id="connection">
            <div class="section-heading">
              <div>
                <h2>SnowLuma</h2>
              </div>
              <p>OneBot 连接</p>
            </div>
            <fieldset class="connection-mode">
              <legend>连接方式</legend>
              <label
                ><input
                  type="radio"
                  name="snowluma.mode"
                  value="ws"
                  checked
                /><span>WebSocket</span></label
              ><label
                ><input type="radio" name="snowluma.mode" value="http" /><span
                  >HTTP</span
                ></label
              >
            </fieldset>
            <div class="fields two-columns" data-connection="ws">
              <label class="field"
                ><span>WebSocket 地址</span
                ><input
                  name="snowluma.ws_url"
                  type="url"
                  placeholder="ws://127.0.0.1:3001/"
              /></label>
              <label class="field"
                ><span>WebSocket 令牌</span
                ><span class="secret"
                  ><input
                    name="snowluma.ws_token"
                    type="password"
                    autocomplete="new-password"
                  /><button type="button" data-clear="snowluma.ws_token">
                    清除
                  </button></span
                ></label
              >
              <small class="connection-hint full"
                >使用支持收发的 Universal 连接。</small
              >
            </div>
            <div class="fields two-columns" data-connection="http" hidden>
              <label class="field"
                ><span>HTTP 地址</span
                ><input
                  name="snowluma.http_url"
                  type="url"
                  placeholder="http://127.0.0.1:3000/"
              /></label>
              <label class="field"
                ><span>HTTP 令牌</span
                ><span class="secret"
                  ><input
                    name="snowluma.http_token"
                    type="password"
                    autocomplete="new-password"
                  /><button type="button" data-clear="snowluma.http_token">
                    清除
                  </button></span
                ></label
              >
              <small class="connection-hint full"
                >在 SnowLuma 的 HTTP 服务中启用 SSE 事件流。</small
              >
            </div>
          </section>
          <section class="settings-section" id="notification-connection">
            <div class="section-heading">
              <div><h2>其他 OneBot 账号</h2></div>
              <p>用于发送群通知</p>
            </div>
            <fieldset class="connection-mode">
              <legend>连接方式</legend>
              <label
                ><input type="radio" name="notification.mode" value="http" checked /><span
                  >HTTP</span
                ></label
              ><label
                ><input type="radio" name="notification.mode" value="ws" /><span
                  >WebSocket</span
                ></label
              >
            </fieldset>
            <div class="fields two-columns" data-notification-connection="http">
              <label class="field"
                ><span>HTTP 地址</span
                ><input
                  name="notification.http_url"
                  type="url"
                  placeholder="http://127.0.0.1:3000/"
              /></label>
              <label class="field"
                ><span>HTTP 令牌</span
                ><span class="secret"
                  ><input
                    name="notification.http_token"
                    type="password"
                    autocomplete="new-password"
                  /><button type="button" data-clear="notification.http_token">
                    清除
                  </button></span
                ></label
              >
            </div>
            <div class="fields two-columns" data-notification-connection="ws" hidden>
              <label class="field"
                ><span>WebSocket 地址</span
                ><input
                  name="notification.ws_url"
                  type="url"
                  placeholder="ws://127.0.0.1:3001/"
              /></label>
              <label class="field"
                ><span>WebSocket 令牌</span
                ><span class="secret"
                  ><input
                    name="notification.ws_token"
                    type="password"
                    autocomplete="new-password"
                  /><button type="button" data-clear="notification.ws_token">
                    清除
                  </button></span
                ></label
              >
            </div>
          </section>
          <section class="settings-section" id="model">
            <div class="section-heading">
              <div>
                <h2>AI 模型</h2>
              </div>
              <p>兼容 Chat Completions 的 API</p>
            </div>
            <div class="fields two-columns">
              <label class="field"
                ><span>API 地址</span
                ><input name="ai.base_url" type="url" placeholder="https://..."
              /></label>
              <label class="field"
                ><span>模型名称</span
                ><input name="ai.model" type="text" placeholder="模型名称"
              /></label>
              <label class="field full"
                ><span>API 密钥</span
                ><span class="secret"
                  ><input
                    name="ai.api_key"
                    type="password"
                    autocomplete="new-password"
                  /><button type="button" data-clear="ai.api_key">
                    清除
                  </button></span
                ></label
              >
            </div>
          </section>
          <section class="settings-section" id="todoist">
            <div class="section-heading">
              <div>
                <h2>Todoist</h2>
              </div>
              <p>API 访问</p>
            </div>
            <label class="field"
              ><span>API 令牌</span
              ><span class="secret"
                ><input
                  name="todoist.token"
                  type="password"
                  autocomplete="new-password"
                /><button type="button" data-clear="todoist.token">
                  清除
                </button></span
              ></label
            >
          </section>
        </form>
        <div class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
  </body>
</html>
